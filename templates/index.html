<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>restartion — transformer asli, kepala panas</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔩</text></svg>">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <div class="logo-mark">⟁</div>
      <div>
        <h1>RESTART<span>ION</span></h1>
        <p class="sub">transformer asli · 57.44M params · dari nol · 4k ctx · memori beneran</p>
      </div>
    </div>
    <div class="top-actions">
      <span id="mem-chip" class="chip" title="fakta yang diinget restartion">🧠 mem: 0</span>
      <button id="btn-reset" class="btn ghost">restart sesi</button>
    </div>
  </header>

  <main id="chat">
    <div id="messages"></div>
  </main>

  <footer id="composer">
    <form id="form">
      <input type="text" id="text" placeholder="ngomong ke restartion... (twin, gng, stfu — semua boleh)" autocomplete="off">
      <button type="submit" id="btn-send" class="btn primary">kirim ▸</button>
    </form>
    <p class="hint">gambar? itu ranah gue — kalau konteksnya masuk akal, GUE yang kirim · marah = si ijo · kabar duka = dance to pay respect</p>
  </footer>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
